[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
# 2^32: the reference-vector and solve-count suites loop over many fills, each with 3 CDF nodes per edge
gas_limit = 4294967296
ffi = false
fs_permissions = [
    { access = "read", path = "./test/vectors" },
    # the deployment record (script/DeployTestnet.s.sol)
    { access = "read-write", path = "./deployments" },
]

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 64
# every invariant suite asserts inside its handlers: a call that reverts fails the run
fail_on_revert = true

[fmt]
line_length = 110
