name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Format
        run: forge fmt --check

      - uses: actions/cache@v4
        with:
          path: |
            out
            cache
          key: forge-${{ hashFiles('foundry.toml', 'foundry.lock', 'src/**', 'script/**', 'test/**') }}
          restore-keys: forge-

      - name: Build and sizes
        run: forge build --sizes

      - name: Test
        run: forge test
