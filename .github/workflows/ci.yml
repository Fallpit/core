name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Format
        run: forge fmt --check

      - name: Deployment records
        run: |
          for f in deployments/*.json; do
            case "$f" in *.dry-run.json) continue ;; esac
            [ -e "$f" ] || continue
            jq . "$f" | cmp -s - "$f" || { echo "::error file=$f::not valid JSON or not formatted as jq . writes it"; bad=1; }
          done
          exit "${bad:-0}"

      - uses: actions/cache@v4
        with:
          path: |
            out
            cache
          key: forge-${{ hashFiles('foundry.toml', 'foundry.lock', 'src/**', 'script/**', 'test/**') }}
          restore-keys: forge-

      - name: Build and sizes
        run: forge build --sizes

      - name: Test
        run: forge test
