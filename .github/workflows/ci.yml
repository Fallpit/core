name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Format
        run: forge fmt --check

      # via_ir compiles are memory heavy: the runner has no swap, and systemd-oomd stops the build
      - name: Add swap
        run: |
          sudo systemctl stop systemd-oomd || true
          sudo swapoff -a || true
          sudo fallocate -l 16G /swapfile2 && sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2 && sudo swapon /swapfile2
          free -h

      - uses: actions/cache@v4
        with:
          path: |
            out
            cache
          key: forge-${{ hashFiles('foundry.toml', 'foundry.lock', 'src/**', 'script/**', 'test/**') }}
          restore-keys: forge-

      - name: Build and sizes
        run: forge build --sizes --threads 2

      - name: Test
        run: forge test --threads 2
